document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +

      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Lato';\n  font-style: normal;\n  font-weight: 900;\n  font-display: swap;\n  src: url(\"b55b68fa-8396-4ce5-aee8-2596db092408\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n<\u002Fstyle>\n<style>/* ICANotes color palette — exported from Figma (light + dark ramps).\n   Each hue is a 15-step ramp (1 = lightest ... 15 = darkest for light ramps). */\n:root {\n  --neutral-light-white: #ffffff;\n  --neutral-light-1: #fbfbfb;\n  --neutral-light-2: #f5f5f5;\n  --neutral-light-3: #ebebeb;\n  --neutral-light-4: #e0e0e0;\n  --neutral-light-5: #d6d6d6;\n  --neutral-light-6: #c2c2c2;\n  --neutral-light-7: #adadad;\n  --neutral-light-8: #999999;\n  --neutral-light-9: #808080;\n  --neutral-light-10: #666666;\n  --neutral-light-11: #525252;\n  --neutral-light-12: #3d3d3d;\n  --neutral-light-13: #292929;\n  --neutral-light-14: #1f1f1f;\n  --neutral-light-15: #141414;\n  --neutral-light-black: #000000;\n\n  /* ICA Blue — the primary brand hue */\n  --ica-blue-light-1: #9fe2ff;\n  --ica-blue-light-2: #9acde5;\n  --ica-blue-light-3: #5dceff;\n  --ica-blue-light-4: #38baf3;\n  --ica-blue-light-5: #2db0e9;\n  --ica-blue-light-6: #24a8e1;\n  --ica-blue-light-7: #1c9cd4;\n  --ica-blue-light-8: #138abe;\n  --ica-blue-light-9: #107ead;\n  --ica-blue-light-10: #0d6f99;\n  --ica-blue-light-11: #095d82;\n  --ica-blue-light-12: #054e6e;\n  --ica-blue-light-13: #014461;\n  --ica-blue-light-14: #014461;\n  --ica-blue-light-15: #023f5c;\n\n  /* ICA Green — the tertiary brand accent (checks, toggles, success) */\n  --ica-green-light-1: #e8ffcf;\n  --ica-green-light-2: #d9fbb5;\n  --ica-green-light-3: #d3f9ab;\n  --ica-green-light-4: #c7f696;\n  --ica-green-light-5: #bbee84;\n  --ica-green-light-6: #afe972;\n  --ica-green-light-7: #aaeb65;\n  --ica-green-light-8: #9de056;\n  --ica-green-light-9: #90d34a;\n  --ica-green-light-10: #7fb942;\n  --ica-green-light-11: #74aa3d;\n  --ica-green-light-12: #79975a;\n  --ica-green-light-13: #558226;\n  --ica-green-light-14: #465c2f;\n  --ica-green-light-15: #3d5425;\n\n  /* Coral — chart series / decorative */\n  --coral-light-1: #fff6f5;\n  --coral-light-2: #ffeceb;\n  --coral-light-3: #ffdedb;\n  --coral-light-4: #ffc8c4;\n  --coral-light-5: #ffb1ac;\n  --coral-light-6: #ff9d97;\n  --coral-light-7: #ff8a82;\n  --coral-light-8: #ff766d;\n  --coral-light-9: #ff6358;\n  --coral-light-10: #ea5a51;\n  --coral-light-11: #d45349;\n  --coral-light-12: #bf4a42;\n  --coral-light-13: #a33f38;\n  --coral-light-14: #80322c;\n  --coral-light-15: #5c201c;\n\n  /* Green (semantic success) */\n  --green-light-1: #edf8e9;\n  --green-light-2: #dcf0d3;\n  --green-light-3: #cbe9bf;\n  --green-light-4: #b7e1a5;\n  --green-light-5: #9bda80;\n  --green-light-6: #81d15f;\n  --green-light-7: #69c740;\n  --green-light-8: #4ebe1f;\n  --green-light-9: #37b400;\n  --green-light-10: #32a500;\n  --green-light-11: #2d9600;\n  --green-light-12: #298700;\n  --green-light-13: #227100;\n  --green-light-14: #1c5a00;\n  --green-light-15: #123d00;\n\n  /* Blue (semantic info) */\n  --blue-light-1: #e9f4fd;\n  --blue-light-2: #d2edfb;\n  --blue-light-3: #bde0f8;\n  --blue-light-4: #9ed0f6;\n  --blue-light-5: #80c0f4;\n  --blue-light-6: #60b5f2;\n  --blue-light-7: #40acef;\n  --blue-light-8: #208dec;\n  --blue-light-9: #008ce9;\n  --blue-light-10: #0079d6;\n  --blue-light-11: #006bc2;\n  --blue-light-12: #005daf;\n  --blue-light-13: #005c92;\n  --blue-light-14: #004c75;\n  --blue-light-15: #003559;\n\n  /* Yellow (semantic warning) */\n  --yellow-light-1: #fffae9;\n  --yellow-light-2: #fff4d3;\n  --yellow-light-3: #ffeebd;\n  --yellow-light-4: #ffe79e;\n  --yellow-light-5: #ffe080;\n  --yellow-light-6: #ffd760;\n  --yellow-light-7: #ffd040;\n  --yellow-light-8: #ffc720;\n  --yellow-light-9: #ffc000;\n  --yellow-light-10: #eaaf00;\n  --yellow-light-11: #d49f00;\n  --yellow-light-12: #bf9000;\n  --yellow-light-13: #a07800;\n  --yellow-light-14: #806000;\n  --yellow-light-15: #5e4700;\n\n  /* Red (semantic error) */\n  --red-light-1: #feeeed;\n  --red-light-2: #fcddda;\n  --red-light-3: #fbc8c3;\n  --red-light-4: #faaaa2;\n  --red-light-5: #f98b80;\n  --red-light-6: #f76f60;\n  --red-light-7: #f65140;\n  --red-light-8: #f43520;\n  --red-light-9: #f31700;\n  --red-light-10: #df1600;\n  --red-light-11: #ca1400;\n  --red-light-12: #b61100;\n  --red-light-13: #980f00;\n  --red-light-14: #7a0c00;\n  --red-light-15: #5b0900;\n\n  /* Lemon yellow — chart series */\n  --lemon-yellow-light-5: #fff0b1;\n  --lemon-yellow-light-7: #ffe989;\n  --lemon-yellow-light-9: #ffe162;\n  --lemon-yellow-light-12: #bfa94a;\n  --lemon-yellow-light-14: #807131;\n\n  /* Royal blue — chart series */\n  --royal-blue-light-5: #a5affd;\n  --royal-blue-light-7: #7887fb;\n  --royal-blue-light-9: #4b5ffa;\n  --royal-blue-light-12: #3847bc;\n  --royal-blue-light-14: #26307d;\n\n  /* Purple — chart series */\n  --purple-light-5: #d6acff;\n  --purple-light-7: #c182ff;\n  --purple-light-9: #ac58ff;\n  --purple-light-12: #8142bf;\n  --purple-light-14: #562c80;\n\n  /* Pink — chart series */\n  --pink-light-5: #ffacc9;\n  --pink-light-7: #ff82ae;\n  --pink-light-9: #ff5892;\n  --pink-light-12: #bf426e;\n  --pink-light-14: #802c49;\n\n  /* Legacy classic palette (older ICANotes screens) */\n  --ica-classic-blue: #082f43;\n  --ica-classic-blue-2: #2d74da;\n  --ica-classic-icon-blue: #104d6a;\n  --ica-classic-link: #2d74da;\n}\n<\u002Fstyle>\n<style>/* Semantic color roles — the layer components consume.\n   Built on top of the raw ramps in colors.css. */\n:root {\n  /* Surfaces & base neutrals */\n  --ica-color-app-surface: var(--neutral-light-white);   /* page background       */\n  --ica-color-surface: var(--neutral-light-1);           /* raised surface        */\n  --ica-color-surface-alt: var(--neutral-light-2);        /* subtle fill           */\n  --ica-color-on-app-surface: var(--neutral-light-12);    /* body text (#3d3d3d)   */\n  --ica-color-subtle: var(--neutral-light-9);             /* muted text (#808080)  */\n  --ica-color-border: rgba(0, 0, 0, 0.24);\n  --ica-color-border-alt: rgba(0, 0, 0, 0.32);\n  --ica-color-border-hover: rgba(0, 0, 0, 0.4);\n\n  --ica-color-base-subtle: var(--neutral-light-3);\n  --ica-color-base-subtle-hover: var(--neutral-light-4);\n  --ica-color-base: var(--neutral-light-1);\n  --ica-color-base-hover: var(--neutral-light-5);\n  --ica-color-base-active: var(--neutral-light-4);\n  --ica-color-base-emphasis: var(--neutral-light-6);\n  --ica-color-base-on-base: var(--neutral-light-12);\n\n  /* Primary — ICA blue */\n  --ica-primary-subtle: var(--ica-blue-light-2);\n  --ica-primary-subtle-hover: var(--ica-blue-light-3);\n  --ica-primary-subtle-active: var(--ica-blue-light-4);\n  --ica-primary: var(--ica-blue-light-9);        /* #107ead */\n  --ica-primary-hover: var(--ica-blue-light-10);  /* #0d6f99 */\n  --ica-primary-active: var(--ica-blue-light-11); /* #095d82 */\n  --ica-primary-emphasis: var(--ica-blue-light-6);\n  --ica-primary-on-primary: var(--neutral-light-white);\n  --ica-primary-on-surface: var(--ica-blue-light-9);\n  --ica-primary-on-subtle: var(--ica-blue-light-15);\n  --ica-primary-opacity-hover: rgba(18, 116, 172, 0.06);\n  --ica-primary-opacity-active: rgba(18, 116, 172, 0.12);\n  --ica-primary-opacity-focus: rgba(18, 116, 172, 0.24);\n\n  /* Secondary — neutral grey */\n  --ica-secondary-subtle: var(--neutral-light-1);\n  --ica-secondary-subtle-hover: var(--neutral-light-2);\n  --ica-secondary-subtle-active: var(--neutral-light-3);\n  --ica-secondary: var(--neutral-light-10);       /* #666666 */\n  --ica-secondary-hover: var(--neutral-light-11);\n  --ica-secondary-active: var(--neutral-light-12);\n  --ica-secondary-emphasis: var(--neutral-light-4);\n  --ica-secondary-on-secondary: var(--neutral-light-white);\n  --ica-secondary-opacity-focus: rgba(102, 102, 102, 0.24);\n\n  /* Tertiary — ICA green (checks, toggles, selection) */\n  --ica-tertiary-subtle: var(--ica-green-light-1);\n  --ica-tertiary-subtle-hover: var(--ica-green-light-6);\n  --ica-tertiary-subtle-active: var(--ica-green-light-4);\n  --ica-tertiary: var(--ica-green-light-2);        /* #d9fbb5 */\n  --ica-tertiary-hover: var(--ica-green-light-9);   /* #90d34a */\n  --ica-tertiary-active: var(--ica-green-light-8);  /* #9de056 */\n  --ica-tertiary-emphasis: var(--ica-green-light-10); /* #7fb942 */\n  --ica-tertiary-on-tertiary: var(--ica-green-light-14); /* #465c2f */\n  --ica-tertiary-on-surface: var(--ica-green-light-9);\n  --ica-tertiary-opacity-hover: rgba(175, 233, 114, 0.2);\n  --ica-tertiary-opacity-active: rgba(175, 233, 114, 0.32);\n  --ica-tertiary-opacity-focus: rgba(134, 208, 56, 0.48);\n  --ica-tertiary-opacity-border: rgba(86, 160, 7, 0.24);\n\n  /* Success — green */\n  --ica-success-subtle: var(--green-light-2);\n  --ica-success-subtle-hover: var(--green-light-3);\n  --ica-success: var(--green-light-9);            /* #37b400 */\n  --ica-success-hover: var(--green-light-10);\n  --ica-success-active: var(--green-light-11);\n  --ica-success-emphasis: var(--green-light-6);\n  --ica-success-on-success: var(--neutral-light-white);\n  --ica-success-on-surface: var(--green-light-11); /* #2d9600 */\n\n  /* Warning — yellow */\n  --ica-warning-subtle: var(--yellow-light-2);\n  --ica-warning-subtle-hover: var(--yellow-light-3);\n  --ica-warning: var(--yellow-light-9);           /* #ffc000 */\n  --ica-warning-hover: var(--yellow-light-10);\n  --ica-warning-active: var(--yellow-light-11);\n  --ica-warning-emphasis: var(--yellow-light-6);\n  --ica-warning-on-warning: var(--yellow-light-15); /* #5e4700 */\n  --ica-warning-on-surface: var(--yellow-light-9);\n\n  /* Error — red */\n  --ica-error-subtle: var(--red-light-2);\n  --ica-error-subtle-hover: var(--red-light-3);\n  --ica-error-subtle-active: var(--red-light-5);\n  --ica-error: var(--red-light-10);               /* #df1600 */\n  --ica-error-hover: var(--red-light-12);\n  --ica-error-active: var(--red-light-10);\n  --ica-error-emphasis: var(--red-light-6);\n  --ica-error-on-error: var(--neutral-light-white);\n  --ica-error-on-surface: var(--red-light-11);    /* #ca1400 */\n\n  /* Info — blue */\n  --ica-info-subtle: var(--blue-light-2);\n  --ica-info-subtle-hover: var(--blue-light-3);\n  --ica-info: var(--blue-light-9);                /* #008ce9 */\n  --ica-info-hover: var(--blue-light-10);\n  --ica-info-active: var(--blue-light-11);\n  --ica-info-emphasis: var(--blue-light-6);\n  --ica-info-on-info: var(--neutral-light-white);\n  --ica-info-on-surface: var(--blue-light-11);    /* #006bc2 */\n\n  /* Categorical chart series */\n  --ica-color-series-a: var(--coral-light-9);\n  --ica-color-series-b: var(--lemon-yellow-light-9);\n  --ica-color-series-c: var(--ica-green-light-9);\n  --ica-color-series-d: var(--royal-blue-light-9);\n  --ica-color-series-e: var(--purple-light-9);\n  --ica-color-series-f: var(--pink-light-9);\n\n  --transparent: rgba(255, 255, 255, 0);\n}\n<\u002Fstyle>\n<style>/* Typography — Lato is the single brand typeface.\n   Type ramp exported from Figma. */\n:root {\n  --font-lato: 'Lato', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;\n\n  /* Display / heading ramp */\n  --font-size-display1: 96px;\n  --font-size-display2: 80px;\n  --font-size-display3: 72px;\n  --font-size-display4: 64px;\n  --font-size-h1: 56px;\n  --font-size-h2: 48px;\n  --font-size-h3: 40px;\n  --font-size-h4: 32px;\n  --font-size-h5: 24px;\n  --font-size-h6: 18px;\n\n  /* Body / UI ramp */\n  --font-size-24: 24px;\n  --font-size-16: 16px;   /* large control text */\n  --font-size-14: 14px;   /* default body / medium control */\n  --font-size-12: 12px;   /* labels, small control, hints */\n  --font-size-10: 10px;   /* chips, badges */\n\n  --letter-spacing-null: 0px;\n\n  /* Weights — Lato ships 400/700; 500/600/800 fall back gracefully */\n  --ica-font-weight-400: 400;\n  --ica-font-weight-500: 500;\n  --ica-font-weight-600: 600;\n  --ica-font-weight-700: 700;\n  --ica-font-weight-800: 800;\n}\n<\u002Fstyle>\n<style>/* Spacing scale (px) — exported from Figma. Dense 2px steps at the low end\n   for form controls, widening to layout gutters. */\n:root {\n  --ica-spacing-0: 0px;\n  --ica-spacing-1: 1px;\n  --ica-spacing-2: 2px;\n  --ica-spacing-3: 3px;\n  --ica-spacing-4: 4px;\n  --ica-spacing-6: 6px;\n  --ica-spacing-8: 8px;\n  --ica-spacing-9: 9px;\n  --ica-spacing-10: 10px;\n  --ica-spacing-12: 12px;\n  --ica-spacing-14: 14px;\n  --ica-spacing-16: 16px;\n  --ica-spacing-18: 18px;\n  --ica-spacing-20: 20px;\n  --ica-spacing-22: 22px;\n  --ica-spacing-24: 24px;\n  --ica-spacing-26: 26px;\n  --ica-spacing-28: 28px;\n  --ica-spacing-30: 30px;\n  --ica-spacing-32: 32px;\n  --ica-spacing-34: 34px;\n  --ica-spacing-36: 36px;\n  --ica-spacing-38: 38px;\n  --ica-spacing-40: 40px;\n  --ica-spacing-42: 42px;\n  --ica-spacing-44: 44px;\n  --ica-spacing-46: 46px;\n  --ica-spacing-48: 48px;\n  --ica-spacing-52: 52px;\n  --ica-spacing-56: 56px;\n  --ica-spacing-60: 60px;\n  --ica-spacing-64: 64px;\n  --ica-spacing-72: 72px;\n  --ica-spacing-80: 80px;\n  --ica-spacing-88: 88px;\n  --ica-spacing-96: 96px;\n  --ica-spacing-112: 112px;\n  --ica-spacing-128: 128px;\n  --ica-spacing-160: 160px;\n  --ica-spacing-192: 192px;\n}\n<\u002Fstyle>\n<style>/* Border-radius scale — exported from Figma. Small, tight radii; controls sit\n   at 6–8px, containers at 12–16px, pills at full. */\n:root {\n  --ica-border-radius-null: 0px;\n  --ica-border-radius-2: 2px;\n  --ica-border-radius-3: 3px;\n  --ica-border-radius-4: 4px;\n  --ica-border-radius-6: 6px;   /* small controls */\n  --ica-border-radius-8: 8px;   /* default control */\n  --ica-border-radius-12: 12px; /* toasts */\n  --ica-border-radius-16: 16px; /* panels / cards */\n  --ica-border-radius-full: 9999px;\n}\n<\u002Fstyle>\n<style>/* Elevation — a 9-step soft shadow scale. Blur + offset grow with the level;\n   alpha ramps 0.04 → 0.32 over black. Panels use the composite card shadow. */\n:root {\n  --ica-elevation-1: 0px 2px 3px 0px rgba(0, 0, 0, 0.04);\n  --ica-elevation-2: 0px 4px 6px 0px rgba(0, 0, 0, 0.06);\n  --ica-elevation-3: 0px 6px 8px 0px rgba(0, 0, 0, 0.08);\n  --ica-elevation-4: 0px 8px 10px 0px rgba(0, 0, 0, 0.12);\n  --ica-elevation-5: 0px 10px 12px 0px rgba(0, 0, 0, 0.16);\n  --ica-elevation-6: 0px 12px 14px 0px rgba(0, 0, 0, 0.2);\n  --ica-elevation-7: 0px 14px 16px 0px rgba(0, 0, 0, 0.24);\n  --ica-elevation-8: 0px 16px 18px 0px rgba(0, 0, 0, 0.28);\n  --ica-elevation-9: 0px 18px 20px 0px rgba(0, 0, 0, 0.32);\n\n  /* Composite shadows used by containers */\n  --ica-shadow-card: 0px 2px 3px 0px rgba(0, 0, 0, 0.04), 0px 4px 16px 0px rgba(0, 0, 0, 0.12);\n  --ica-shadow-toast: 0px 2px 3px 0px rgba(0, 0, 0, 0.04), 0px 4px 16px 0px rgba(0, 0, 0, 0.08);\n  --ica-shadow-focus-primary: 0px 0px 0px 2px rgba(18, 116, 172, 0.24);\n  --ica-shadow-focus-tertiary: 0px 0px 2px 2px rgba(134, 208, 56, 0.48);\n}\n<\u002Fstyle>\n<style>/* ICANotes Design System — global entry point.\n   Consumers link this one file. Import order matters: raw ramps first,\n   then the semantic swatch layer that references them. */\n/* ICANotes ships a single webfont: Lato (400/700 + italics).\n   The product loads it from Google Fonts; we declare it the same way so the\n   token --font-lato resolves for every consumer. */\n/* latin-ext */\n@font-face {\n  font-family: 'Lato';\n  font-style: italic;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"ad9d58f7-8f8d-4d39-8974-4b9b102522df\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Lato';\n  font-style: italic;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"f3929872-4e ht-13: #292929;\n  --neutral-light-14: #1f1f1f;\n  --neutral-light-15: #141414;\n  --neutral-light-black: #000000;\n\n  /* ICA Blue — the primary brand hue */\n  --ica-blue-light-1: #9fe2ff;\n  --ica-blue-light-2: #9acde5;\n  --ica-blue-light-3: #5dceff;\n  --ica-blue-light-4: #38baf3;\n  --ica-blue-light-5: #2db0e9;\n  --ica-blue-light-6: #24a8e1;\n  --ica-blue-light-7: #1c9cd4;\n  --ica-blue-light-8: #138abe;\n  --ica-blue-light-9: #107ead;\n  --ica-blue-light-10: #0d6f99;\n  --ica-blue-light-11: #095d82;\n  --ica-blue-light-12: #054e6e;\n  --ica-blue-light-13: #014461;\n  --ica-blue-light-14: #014461;\n  --ica-blue-light-15: #023f5c;\n\n  /* ICA Green — the tertiary brand accent (checks, toggles, success) */\n  --ica-green-light-1: #e8ffcf;\n  --ica-green-light-2: #d9fbb5;\n  --ica-green-light-3: #d3f9ab;\n  --ica-green-light-4: #c7f696;\n  --ica-green-light-5: #bbee84;\n  --ica-green-light-6: #afe972;\n  --ica-green-light-7: #aaeb65;\n  --ica-green-light-8: #9de056;\n  --ica-green-light-9: #90d34a;\n  --ica-green-light-10: #7fb942;\n  --ica-green-light-11: #74aa3d;\n  --ica-green-light-12: #79975a;\n  --ica-green-light-13: #558226;\n  --ica-green-light-14: #465c2f;\n  --ica-green-light-15: #3d5425;\n\n  /* Coral — chart series / decorative */\n  --coral-light-1: #fff6f5;\n  --coral-light-2: #ffeceb;\n  --coral-light-3: #ffdedb;\n  --coral-light-4: #ffc8c4;\n  --coral-light-5: #ffb1ac;\n  --coral-light-6: #ff9d97;\n  --coral-light-7: #ff8a82;\n  --coral-light-8: #ff766d;\n  --coral-light-9: #ff6358;\n  --coral-light-10: #ea5a51;\n  --coral-light-11: #d45349;\n  --coral-light-12: #bf4a42;\n  --coral-light-13: #a33f38;\n  --coral-light-14: #80322c;\n  --coral-light-15: #5c201c;\n\n  /* Green (semantic success) */\n  --green-light-1: #edf8e9;\n  --green-light-2: #dcf0d3;\n  --green-light-3: #cbe9bf;\n  --green-light-4: #b7e1a5;\n  --green-light-5: #9bda80;\n  --green-light-6: #81d15f;\n  --green-light-7: #69c740;\n  --green-light-8: #4ebe1f;\n  --green-light-9: #37b #26307d;\n\n  /* Purple — chart series */\n  --purple-light-5: #d6acff;\n  --purple-light-7: #c182ff;\n  --purple-light-9: #ac58ff;\n  --purple-light-12: #8142bf;\n  --purple-light-14: #562c80;\n\n  /* Pink — chart series */\n  --pink-light-5: #ffacc9;\n  --pink-light-7: #ff82ae;\n  --pink-light-9: #ff5892;\n  --pink-light-12: #bf426e;\n  --pink-light-14: #802c49;\n\n  /* Legacy classic palette (older ICANotes screens) */\n  --ica-classic-blue: #082f43;\n  --ica-classic-blue-2: #2d74da;\n  --ica-classic-icon-blue: #104d6a;\n  --ica-classic-link: #2d74da;\n}\n\n/* Semantic color roles — the layer components consume.\n   Built on top of the raw ramps in colors.css. */\n:root {\n  /* Surfaces & base neutrals */\n  --ica-color-app-surface: var(--neutral-light-white);   /* page background       */\n  --ica-color-surface: var(--neutral-light-1);           /* raised surface        */\n  --ica-color-surface-alt: var(--neutral-light-2);        /* subtle fill           */\n  --ica-color-on-app-surface: var(--neutral-light-12);    /* body text (#3d3d3d)   */\n  --ica-color-subtle: var(--neutral-light-9);             /* muted text (#808080)  */\n  --ica-color-border: rgba(0, 0, 0, 0.24);\n  --ica-color-border-alt: rgba(0, 0, 0, 0.32);\n  --ica-color-border-hover: rgba(0, 0, 0, 0.4);\n\n  --ica-color-base-subtle: var(--neutral-light-3);\n  --ica-color-base-subtle-hover: var(--neutral-light-4);\n  --ica-color-base: var(--neutral-light-1);\n  --ica-color-base-hover: var(--neutral-light-5);\n  --ica-color-base-active: var(--neutral-light-4);\n  --ica-color-base-emphasis: var(--neutral-light-6);\n  --ica-color-base-on-base: var(--neutral-light-12);\n\n  /* Primary — ICA blue */\n  --ica-primary-subtle: var(--ica-blue-light-2);\n  --ica-primary-subtle-hover: var(--ica-blue-light-3);\n  --ica-primary-subtle-active: var(--ica-blue-light-4);\n  --ica-primary: var(--ica-blue-light-9);        /* #107ead */\n  --ica-primary-hover: var(--ica-blue-light-10);  /* #0d6f99 */\n  --ica-primary-active: var(--ica-blue-light-11); /* #095d82 */\n  --ica-primary-emphasis: var(--ica-blue-light-6);\n  --ica-primary-on-primary: var(--neutral-light-white);\n  --ica-primary-on-surface: var(--ica-blue-light-9);\n  --ica-primary-on-subtle: var(--ica-blue-light-15);\n  --ica-primary-opacity-hover: rgba(18, 116, 172, 0.06);\n  --ica-primary-opacity-active: rgba(18, 116, 172, 0.12);\n  --ica-primary-opacity-focus: rgba(18, 116, 172, 0.24);\n\n  /* Secondary — neutral grey */\n  --ica-secondary-subtle: var(--neutral-light-1);\n  --ica-secondary-subtle-hover: var(--neutral-light-2);\n  --ica-secondary-subtle-active: var(--neutral-light-3);\n  --ica-secondary: var(--neutral-light-10);       /* #666666 */\n  --ica-secondary-hover: var(--neutral-light-11);\n  --ica-secondary-active: var(--neutral-light-12);\n  --ica-secondary-emphasis: var(--neutral-light-4);\n  --ica-secondary-on-secondary: var(--neutral-light-white);\n  --ica-secondary-opacity-focus: rgba(102, 102, 102, 0.24);\n\n  /* Tertiary — ICA green (checks, toggles, selection) */\n  --ica-tertiary-subtle: var(--ica-green-light-1);\n  --ica-tertiary-subtle-hover: var(--ica-green-light-6);\n  --ica-tertiary-subtle-active: var(--ica-green-light-4);\n  --ica-tertiary: var(--ica-green-light-2);        /* #d9fbb5 */\n  --ica-tertiary-hover: var(--ica-green-light-9);   /* #90d34a */\n  --ica-tertiary-active: var(--ica-green-light-8);  /* #9de056 */\n  --ica-tertiary-emphasis: var(--ica-green-light-10); /* #7fb942 */\n  --ica-tertiary-on-tertiary: var(--ica-green-light-14); /* #465c2f */\n  --ica-tertiary-on-surface: var(--ica-green-light-9);\n  --ica-tertiary-opacity-hover: rgba(175, 233, 114, 0.2);\n  --ica-tertiary-opacity-active: rgba(175, 233, 114, 0.32);\n  --ica-tertiary-opacity-focus: rgba(134, 208, 56, 0.48);\n  --ica-tertiary-opacity-border: rgba(86, 160, 7, 0.24);\n\n  /* Success — green */\n  --ica-success-subtle: var(--green-light-2);\n  --ica-success-subtle-hover: var(--green-light-3);\n  --ica-success: var(--green-light-9);            /* #37b400 */\n  --ica-success-hover: var(--green-light-10);\n  --ica-success-active: var(--green-light-11);\n  --ica-success-emphasis: var(--green-light-6);\n  --ica-success-on-success: var(--neutral-light-white);\n  --ica-success-on-surface: var(--green-light-11); /* #2d9600 */\n\n  /* Warning — yellow */\n  --ica-warning-subtle: var(--yellow-light-2);\n  --ica-warning-subtle-hover: var(--yellow-light-3);\n  --ica-warning: var(--yellow-light-9);           /* #ffc000 */\n  --ica-warning-hover: var(--yellow-light-10);\n  --ica-warning-active: var(--yellow-light-11);\n  --ica-warning-emphasis: var(--yellow-light-6);\n  --ica-warning-on-warning: var(--yellow-light-15); /* #5e4700 */\n  --ica-warning-on-surface: var(--yellow-light-9);\n\n  /* Error — red */\n  --ica-error-subtle: var(--red-light-2);\n  --ica-error-subtle-hover: var(--red-light-3);\n  --ica-error-subtle-active: var(--red-light-5);\n  --ica-error: var(--red-light-10);               /* #df1600 */\n  --ica-error-hover: var(--red-light-12);\n  --ica-error-active: var(--red-light-10);\n  --ica-error-emphasis: var(--red-light-6);\n  --ica-error-on-error: var(--neutral-light-white);\n  --ica-error-on-surface: var(--red-light-11);    /* #ca1400 */\n\n  /* Info — blue */\n  --ica-info-subtle: var(--blue-light-2);\n  --ica-info-subtle-hover: var(--blue-light-3);\n  --ica-info: var(--blue-light-9);                /* #008ce9 */\n  --ica-info-hover: var(--blue-light-10);\n  --ica-info-active: var(--blue-light-11);\n  --ica-info-emphasis: var(--blue-light-6);\n  --ica-info-on-info: var(--neutral-light-white);\n  --ica-info-on-surface: var(--blue-light-11);    /* #006bc2 */\n\n  /* Categorical chart series */\n  --ica-color-series-a: var(--coral-light-9);\n  --ica-color-series-b: var(--lemon-yellow-light-9);\n  --ica-color-series-c: var(--ica-green-light-9);\n  --ica-color-series-d: var(--royal-blue-light-9);\n  --ica-color-series-e: var(--purple-light-9);\n  --ica-color-series-f: var(--pink-light-9);\n\n  --transparent: rgba(255, 255, 255, 0);\n}\n\n/* Typography — Lato is the single brand typeface.\n   Type ramp exported from Figma. */\n:root {\n  --font-lato: 'Lato', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;\n\n  /* Display / heading ramp */\n  --font-size-display1: 96px;\n  --font-size-display2: 80px;\n  --font-size-display3: 72px;\n  --font-size-display4: 64px;\n  --font-size-h1: 56px;\n  --font-size-h2: 48px;\n  --font-size-h3: 40px;\n  --font-size-h4: 32px;\n  --font-size-h5: 24px;\n  --font-size-h6: 18px;\n\n  /* Body / UI ramp */\n  --font-size-24: 24px;\n  --font-size-16: 16px;   /* large control text */\n  --font-size-14: 14px;   /* default body / medium control */\n  --font-size-12: 12px;   /* labels, small control, hints */\n  --font-size-10: 10px;   /* chips, badges */\n\n  --letter-spacing-null: 0px;\n\n  /* Weights — Lato ships 400/700; 500/600/800 fall back gracefully */\n  --ica-font-weight-400: 400;\n  --ica-font-weight-500: 500;\n  --ica-font-weight-600: 600;\n  --ica-font-weight-700: 700;\n  --ica-font-weight-800: 800;\n}\n\n/* Spacing scale (px) — exported from Figma. Dense 2px steps at the low end\n   for form controls, widening to layout gutters. */\n:root {\n  --ica-spacing-0: 0px;\n  --ica-spacing-1: 1px;\n  --ica-spacing-2: 2px;\n  --ica-spacing-3: 3px;\n  --ica-spacing-4: 4px;\n  --ica-spacing-6: 6px;\n  --ica-spacing-8: 8px;\n  --ica-spacing-9: 9px;\n  --ica-spacing-10: 10px;\n  --ica-spacing-12: 12px;\n  --ica-spacing-14: 14px;\n  --ica-spacing-16: 16px;\n  --ica-spacing-18: 18px;\n  --ica-spacing-20: 20px;\n  --ica-spacing-22: 22px;\n  --ica-spacing-24: 24px;\n  --ica-spacing-26: 26px;\n  --ica-spacing-28: 28px;\n  --ica-spacing-30: 30px;\n  --ica-spacing-32: 32px;\n  --ica-spacing-34: 34px;\n  --ica-spacing-36: 36px;\n  --ica-spacing-38: 38px;\n  --ica-spacing-40: 40px;\n  --ica-spacing-42: 42px;\n  --ica-spacing-44: 44px;\n  --ica-spacing-46: 46px;\n  --ica-spacing-48: 48px;\n  --ica-spacing-52: 52px;\n  --ica-spacing-56: 56px;\n  --ica-spacing-60: 60px;\n  --ica-spacing-64: 64px;\n  --ica-spacing-72: 72px;\n  --ica-spacing-80: 80px;\n  --ica-spacing-88: 88px;\n  --ica-spacing-96: 96px;\n  --ica-spacing-112: 112px;\n  --ica-spacing-128: 128px;\n  --ica-spacing-160: 160px;\n  --ica-spacing-192: 192px;\n}\n\n/* Border-radius scale — exported from Figma. Small, tight radii; controls sit\n   at 6–8px, containers at 12–16px, pills at full. */\n:root {\n  --ica-border-radius-null: 0px;\n  --ica-border-radius-2: 2px;\n  --ica-border-radius-3: 3px;\n  --ica-border-radius-4: 4px;\n  --ica-border-radius-6: 6px;   /* small controls */\n  --ica-border-radius-8: 8px;   /* default control */\n  --ica-border-radius-12: 12px; /* toasts */\n  --ica-border-radius-16: 16px; /* panels / cards */\n  --ica-border-radius-full: 9999px;\n}\n\n/* Elevation — a 9-step soft shadow scale. Blur + offset grow with the level;\n   alpha ramps 0.04 → 0.32 over black. Panels use the composite card shadow. */\n:root {\n  --ica-elevation-1: 0px 2px 3px 0px rgba(0, 0, 0, 0.04);\n  --ica-elevation-2: 0px 4px 6px 0px rgba(0, 0, 0, 0.06);\n  --ica-elevation-3: 0px 6px 8px 0px rgba(0, 0, 0, 0.08);\n  --ica-elevation-4: 0px 8px 10px 0px rgba(0, 0, 0, 0.12);\n  --ica-elevation-5: 0px 10px 12px 0px rgba(0, 0, 0, 0.16);\n  --ica-elevation-6: 0px 12px 14px 0px rgba(0, 0, 0, 0.2);\n  --ica-elevation-7: 0px 14px 16px 0px rgba(0, 0, 0, 0.24);\n  --ica-elevation-8: 0px 16px 18px 0px rgba(0, 0, 0, 0.28);\n  --ica-elevation-9: 0px 18px 20px 0px rgba(0, 0, 0, 0.32);\n\n  /* Composite shadows used by containers */\n  --ica-shadow-card: 0px 2px 3px 0px rgba(0, 0, 0, 0.04), 0px 4px 16px 0px rgba(0, 0, 0, 0.12);\n  --ica-shadow-toast: 0px 2px 3px 0px rgba(0, 0, 0, 0.04), 0px 4px 16px 0px rgba(0, 0, 0, 0.08);\n  --ica-shadow-focus-primary: 0px 0px 0px 2px rgba(18, 116, 172, 0.24);\n  --ica-shadow-focus-tertiary: 0px 0px 2px 2px rgba(134, 208, 56, 0.48);\n}\n\n<\u002Fstyle>\n<script src=\"25512dd5-0a31-43d9-b112-c1b76617260 color:var(--ica-color-on-app-surface)\">Client and Appointment Transfer<\u002Fh2>\n          <p style=\"margin:0;font-size:14px;line-height:1.5;color:var(--ica-color-subtle)\">Transfer clients and appointments from one clinician to another<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"height:1px;background:var(--ica-color-border)\"><\u002Fdiv>\n\n        <div style=\"display:flex;flex-direction:column;gap:20px;padding:24px 32px 28px\">\n          <div style=\"display:flex;flex-direction:column;gap:12px\">\n            <x-import component-from-global-scope=\"ICANotesDesignSystem_94514a.RadioGroup\" options=\"{{ transferOption }}\" value=\"{{ mode }}\" on-change=\"{{ chooseTransfer }}\" hint-size=\"100%,20px\"><\u002Fx-import>\n\n            <div style=\"display:flex;flex-direction:column;gap:12px;padding-left:24px\">\n              <x-import component-from-global-scope=\"ICANotesDesignSystem_94514a.FormField\" label=\"Transfer to Clinician\" required=\"{{ true }}\" hint-size=\"100%,64px\">\n                <x-import component-from-global-scope=\"ICANotesDesignSystem_94514a.Select\" options=\"{{ clinicians }}\" value=\"{{ clinician }}\" on-change=\"{{ pickClinician }}\" placeholder=\"Select a clinician\" size=\"large\" disabled=\"{{ selectDisabled }}\" hint-size=\"100%,40px\"><\u002Fx-import>\n              <\u002Fx-import>\n\n              <sc-if value=\"{{ warningVisible }}\" hint-placeholder-val=\"{{ true }}\">\n                <div role=\"note\" style=\"display:flex;align-items:center;gap:10px;padding:12px 14px;border:1px solid var(--ica-warning-emphasis);border-left:4px solid var(--ica-warning);border-radius:var(--ica-border-radius-8,8px);background:var(--ica-warning-subtle)\">\n                  <span style=\"display:flex;color:var(--ica-warning-on-warning);flex:0 0 auto\">\n                    <x-import component-from-global-scope=\"ICANotesDesignSystem_94514a.Icon\" name=\"ica-warning-triangle\" size=\"16\" color=\"currentColor\" hint-size=\"16px,16px\"><\u002Fx-import>\n                  <\u002Fspan>\n                  <div style=\"display:flex;flex-direction:column;gap:4px\">\n                    <span style=\"font-size:13px;line-height:1.5;color:var(--ica-warning-on-warning);text-wrap:pretty\">The new clinician will have access to this client's full note history once added to the client's clinical team.<\u002Fspan>\n                    <a href=\"{{ helpArticleUrl }}\" target=\"_blank\" rel=\"noreferrer\" style=\"font-size:13px;font-weight:700;line-height:1.5;color:var(--ica-warning-on-warning);text-decoration:underline;text-underline-offset:2px;width:fit-content\" style-hover=\"opacity:0.8\">Learn how Caseload Security controls note access<\u002Fa>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <x-import component-from-global-scope=\"ICANotesDesignSystem_94514a.RadioGroup\" options=\"{{ keepOption }}\" value=\"{{ mode }}\" on-change=\"{{ chooseKeep }}\" hint-size=\"100%,20px\"><\u002Fx-import>\n        <\u002Fdiv>\n\n        <div style=\"display:flex;align-items:center;justify-content:flex-end;gap:12px;padding:16px 32px;background:var(--ica-primary-opacity-active);border-top:1px solid var(--ica-color-border)\">\n          <x-import component-from-global-scope=\"ICANotesDesignSystem_94514a.Button\" theme-color=\"secondary\" fill-mode=\"outline\" size=\"large\" hint-size=\"auto,40px\">Cancel<\u002Fx-import>\n          <div style=\"width:104px;display:flex\">\n            <x-import component-from-global-scope=\"ICANotesDesignSystem_94514a.Button\" theme-color=\"primary\" fill-mode=\"solid\" size=\"large\" stretch=\"{{ true }}\" disabled=\"{{ saveDisabled }}\" hint-size=\"104px,40px\">Save<\u002Fx-import>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1000,&quot;height&quot;:640},&quot;mode&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;transfer&quot;,&quot;keep&quot;],&quot;default&quot;:&quot;transfer&quot;,&quot;tsType&quot;:&quot;'transfer' | 'keep'&quot;,&quot;section&quot;:&quot;State&quot;},&quot;showWarning&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;State&quot;},&quot;deactivatedClinician&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;John Smith&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Content&quot;},&quot;helpArticleUrl&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;https://help.icanotes.com/portal/en/kb/articles/caseload-security&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Content&quot;}}\">\nclass Component extends DCLogic {\n  state = { mode: null, clinician: null };\n\n  renderVals() {\n    const clinicianName = this.props.deactivatedClinician ?? 'John Smith';\n    const mode = this.state.mode ?? this.props.mode ?? 'transfer';\n    const isTransfer = mode === 'transfer';\n    const clinician = this.state.clinician ?? 'John Doe';\n    return {\n      mode,\n      clinician,\n      clinicians: ['Danelyn Guatno', 'Jana Atallah', 'Janina Russian', 'John Doe', 'Josh Reiss', 'Kif Fayad'],\n      transferOption: [{ value: 'transfer', label: 'Transferring clients and appointments from ' + clinicianName + ' to another clinician' }],\n      keepOption: [{ value: 'keep', label: 'Keep appointments as-is and switch to a provider manually for each appointment' }],\n      chooseTransfer: () => this.setState({ mode: 'transfer' }),\n      chooseKeep: () => this.setState({ mode: 'keep' }),\n      pickClinician: (v) => this.setState({ clinician: v }),\n      selectDisabled: !isTransfer,\n      saveDisabled: isTransfer && !clinician,\n      warningVisible: isTransfer && (this.props.showWarning ?? true),\n      helpArticleUrl: this.props.helpArticleUrl ?? 'https://help.icanotes.com/portal/en/kb/articles/caseload-security',\n    };\n  }\n}\n<\u002Fscript>\n\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
