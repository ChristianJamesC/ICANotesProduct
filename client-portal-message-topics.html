<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ICANotes+ – Client Portal | Message Topics</title>
  <link rel="stylesheet" href="../design-system/ICANotes-design-sync-bundle/styles.css" />
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font-lato);
      color: var(--ica-color-on-app-surface);
      font-size: var(--font-size-14);
      overflow: hidden;
    }

    /* ---- App layout ---- */
    .l-app  { display: flex; height: 100vh; }
    .l-main { flex: 1; display: flex; flex-direction: column; overflow: hidden; min-width: 0; }

    /* ---- Icon nav ---- */
    .icon-nav {
      width: 68px; background: #1d2c3e;
      display: flex; flex-direction: column; align-items: center;
      padding-top: 10px; flex-shrink: 0;
    }
    .icon-nav-spacer { flex: 1; }
    .nav-item {
      width: 100%; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 8px 0 5px; cursor: pointer;
      color: rgba(255,255,255,.5); font-size: 7.5px;
      letter-spacing: .03em; text-transform: uppercase;
      gap: 4px; user-select: none;
    }
    .nav-item.active  { background: rgba(255,255,255,.13); color: rgba(255,255,255,.95); }
    .nav-item:hover:not(.active) { background: rgba(255,255,255,.07); color: rgba(255,255,255,.8); }
    .nav-icon { width: 20px; height: 20px; display: flex; align-items: center; justify-content: center; opacity: .7; }
    .nav-item.active .nav-icon { opacity: 1; }

    /* ---- Header ---- */
    .app-header {
      height: 56px; background: var(--ica-color-app-surface);
      border-bottom: 1px solid var(--ica-color-border);
      display: flex; align-items: center;
      padding: 0 20px; gap: 16px; flex-shrink: 0;
    }
    .logo-wrap { display: flex; flex-direction: column; flex-shrink: 0; gap: 1px; }
    .logo-row  { display: flex; align-items: center; gap: 2px; }
    .logo-text { font-size: 17px; font-weight: 700; color: var(--ica-primary); }
    .logo-icon { width: 18px; height: 18px; }
    .logo-plus { font-size: 19px; font-weight: 800; color: #2bb573; line-height: 1; }
    .logo-sub  { font-size: 10px; color: var(--ica-secondary-active); letter-spacing: .02em; }
    .hdr-search { flex: 0 1 400px; }
    .hdr-right  { margin-left: auto; display: flex; align-items: center; gap: 14px; flex-shrink: 0; }
    .hdr-icon   { width: 28px; height: 28px; border-radius: 6px; display: flex; align-items: center; justify-content: center; color: var(--ica-secondary-active); cursor: pointer; }
    .hdr-icon:hover { background: var(--ica-secondary-subtle); }
    .hdr-user   { display: flex; align-items: center; gap: 6px; cursor: pointer; font-size: 14px; }
    .avatar     { width: 28px; height: 28px; border-radius: 50%; background: var(--ica-primary); display: flex; align-items: center; justify-content: center; color: white; font-size: 11px; font-weight: 700; }

    /* ---- Top tab bar ---- */
    .tab-bar { background: var(--ica-color-app-surface); border-bottom: 1px solid var(--ica-color-border); display: flex; padding: 0 20px; overflow-x: auto; flex-shrink: 0; }
    .tab-bar::-webkit-scrollbar { display: none; }
    .tab { padding: 11px 14px; font-size: 14px; color: var(--ica-color-on-app-surface); cursor: pointer; border-bottom: 2px solid transparent; white-space: nowrap; position: relative; bottom: -1px; flex-shrink: 0; }
    .tab.active { color: var(--ica-primary); font-weight: 700; border-bottom-color: var(--ica-primary); }
    .tab:hover:not(.active) { color: var(--ica-primary); }

    /* ---- Settings area ---- */
    .settings-area { flex: 1; display: flex; overflow: hidden; background: #b4c3d2; }

    /* ---- Settings sidebar ---- */
    .settings-nav { width: 182px; background: var(--ica-color-app-surface); border-right: 1px solid var(--ica-color-border); flex-shrink: 0; overflow-y: auto; padding: 16px 0; }
    .nav-section { padding: 4px 14px 10px; font-size: 12px; font-weight: 700; color: var(--ica-secondary-active); }
    .nav-link { display: flex; align-items: center; gap: 6px; padding: 7px 14px; font-size: 14px; color: var(--ica-color-on-app-surface); cursor: pointer; border-left: 3px solid transparent; user-select: none; }
    .nav-link:hover:not(.active) { background: var(--ica-secondary-subtle); }
    .nav-link.active { background: var(--ica-primary-subtle); color: var(--ica-primary); font-weight: 700; border-left-color: var(--ica-primary); }
    .badge { font-size: 9px; font-weight: 700; color: var(--ica-primary); background: var(--ica-primary-subtle); padding: 1px 6px; border-radius: 999px; border: 1px solid var(--ica-primary); }

    /* ---- Settings content ---- */
    .settings-content { flex: 1; overflow-y: auto; padding: 24px; min-width: 0; }

    /* ============================================================
       Message Topics panel
    ============================================================ */
    .panel-desc { font-size: 14px; color: var(--ica-secondary-active); max-width: 580px; margin-top: 12px; margin-bottom: 16px; }

    /* Grid — styles copied from kendo-grid token spec */
    .grid-wrap { border: 1px solid var(--ica-color-border); border-radius: var(--ica-border-radius-8); overflow: hidden; }

    /* Toolbar (matches kendo-grid editing state toolbar) */
    .grid-toolbar {
      height: 49px; background: var(--ica-secondary-subtle);
      border-bottom: 1px solid var(--ica-secondary-emphasis);
      display: flex; align-items: center; padding: 0 8px; gap: 8px;
    }

    .kgrid { width: 100%; border-collapse: collapse; font-size: 14px; color: var(--ica-color-on-app-surface); }

    /* Header — ica-tertiary-opacity-hover fill + ica-tertiary-opacity-border bottom */
    .kgrid thead th {
      height: 41px; background: var(--ica-tertiary-opacity-hover);
      border-bottom: 1px solid var(--ica-tertiary-opacity-border);
      padding: 4px 8px; text-align: left; font-size: 14px; font-weight: 700;
      white-space: nowrap;
    }
    /* Column separator on every header cell after the first */
    .kgrid thead th + th { border-left: 1px solid rgba(0,0,0,.08); }

    /* Rows — 40px high, alternating ica-secondary-subtle / ica-secondary-subtle-active */
    .kgrid tbody tr { height: 40px; }
    .kgrid tbody tr:nth-child(odd)  td { background: var(--ica-color-app-surface); }
    .kgrid tbody tr:nth-child(even) td { background: var(--ica-secondary-subtle); }
    .kgrid tbody tr:hover td { background: var(--ica-tertiary-opacity-hover); }
    .kgrid tbody td {
      padding: 4px 8px; vertical-align: middle;
      border-bottom: 1px solid var(--ica-color-border-alt);
    }
    .kgrid tbody td + td { border-left: 1px solid rgba(0,0,0,.08); }
    .kgrid tbody tr:last-child td { border-bottom: none; }

    .grid-empty { text-align: center; height: 40px; line-height: 40px; color: var(--ica-secondary-active); font-size: 14px; }

    /* Pager — 40px high, matches kendo-grid pager */
    .grid-footer {
      height: 40px; display: flex; align-items: center; gap: 4px;
      padding: 0 8px; background: var(--ica-color-app-surface);
      border-top: 1px solid var(--ica-color-border); font-size: 12px; color: var(--ica-color-on-app-surface);
    }
    .pg-btn {
      width: 24px; height: 24px; display: flex; align-items: center; justify-content: center;
      border: 1px solid var(--ica-color-border); border-radius: var(--ica-border-radius-6);
      background: var(--ica-color-app-surface); cursor: pointer; font-size: 11px;
      color: var(--ica-color-on-app-surface); padding: 0;
    }
    .pg-btn:disabled { opacity: .4; cursor: default; }
    /* Selected page — ica-tertiary fill (matches kendo-grid pager spec) */
    .pg-current {
      width: 24px; height: 24px; display: flex; align-items: center; justify-content: center;
      background: var(--ica-tertiary); border-radius: var(--ica-border-radius-6);
      font-size: 12px; font-weight: 700; color: white;
    }
    .pg-select { width: 58px; border: 1px solid var(--ica-color-border); border-radius: var(--ica-border-radius-6); padding: 2px 6px; font-size: 12px; font-family: var(--font-lato); background: var(--ica-color-app-surface); }
    .pg-count  { margin-left: auto; font-size: 12px; }

    .row-name { font-weight: 700; }
    .row-muted { color: var(--ica-secondary-active); font-style: italic; }
    .outside-chip {
      display: inline-flex; align-items: center; gap: 3px;
      font-size: 10px; font-weight: 700; color: var(--ica-warning-on-surface);
      background: var(--ica-warning-subtle); border: 1px solid var(--ica-warning);
      border-radius: 999px; padding: 1px 7px; margin-left: 6px; white-space: nowrap;
    }
    .row-actions { display: flex; gap: 6px; }

    /* ============================================================
       Dialog
    ============================================================ */
    .dlg-backdrop {
      position: fixed; inset: 0; background: rgba(0,0,0,.5);
      display: flex; align-items: center; justify-content: center; z-index: 999;
    }
    .dlg {
      background: white; border-radius: 16px; width: 480px;
      border: 1px solid #ccc;
      box-shadow: 0 2px 3px rgba(0,0,0,.04), 0 4px 16px rgba(0,0,0,.12);
    }
    .dlg-head {
      padding: 16px 24px 12px;
      border-bottom: 1px solid var(--ica-color-border);
    }
    .dlg-title { font-size: 16px; font-weight: 700; color: var(--ica-primary); }
    .dlg-body  { padding: 20px 24px; display: flex; flex-direction: column; gap: 16px; }
    .dlg-foot  { padding: 14px 24px; border-top: 1px solid var(--ica-color-border); display: flex; justify-content: flex-end; gap: 10px; }

    /* Custom MultiSelect — visually matches ica-dropdown-multiple spec */
    .ms-wrap     { position: relative; }
    .ms-box      {
      display: flex; align-items: center;
      height: 32px; padding: 0 0 0 10px;
      background: var(--ica-secondary-subtle);
      border: 1px solid var(--ica-color-border);
      border-radius: var(--ica-border-radius-8);
      font-size: var(--font-size-14); font-family: var(--font-lato);
      color: var(--ica-color-on-app-surface);
      cursor: pointer; user-select: none; overflow: hidden;
    }
    .ms-box:hover            { background: var(--ica-color-surface-alt); }
    .ms-box.ms-open          { border-color: var(--ica-color-on-app-surface); box-shadow: 0 0 0 3px var(--ica-tertiary-opacity-focus); }
    .ms-value                { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .ms-placeholder          { color: var(--ica-secondary-active); }
    /* Caret button — 30px wide, matching ica-dropdown */
    .ms-caret                { flex-shrink: 0; width: 30px; display: flex; align-items: center; justify-content: center; }
    /* Popup — 8px radius, 1px border, shadow matching ica-dropdown popup spec */
    .ms-list                 {
      position: absolute; top: calc(100% + 2px); left: 0; min-width: 100%;
      max-height: 200px; overflow-y: auto;
      background: var(--ica-color-app-surface);
      border: 1px solid var(--ica-color-on-app-surface);
      border-radius: var(--ica-border-radius-8);
      box-shadow: 0 4px 16px rgba(0,0,0,.12);
      z-index: 500; padding: var(--ica-spacing-8) 0;
    }
    /* Items — 32px high, 8px padding, 8px between checkbox and label */
    .ms-item                 { display: flex; align-items: center; gap: var(--ica-spacing-8); height: 32px; padding: 0 var(--ica-spacing-8); cursor: pointer; font-size: var(--font-size-14); font-family: var(--font-lato); }
    .ms-item:hover           { background: var(--ica-tertiary-opacity-hover); }
    .ms-item.ms-checked      { background: var(--ica-tertiary-opacity-active); border-radius: var(--ica-border-radius-6); }
    /* Checkbox — 16px, green fill matching ica-checkbox */
    .ms-cb                   { width: 16px; height: 16px; accent-color: var(--ica-tertiary); flex-shrink: 0; cursor: pointer; }
    /* Standalone label row for recipients (outside ica-formfield) */
    .dlg-label               { font-size: var(--font-size-12); font-weight: var(--ica-font-weight-700); display: block; margin-bottom: var(--ica-spacing-4); color: var(--ica-color-on-app-surface); }
    .dlg-hint                { font-size: var(--font-size-12); color: var(--ica-secondary-active); margin-top: var(--ica-spacing-4); }
    .dlg-error               { font-size: var(--font-size-12); color: var(--ica-error); margin-top: var(--ica-spacing-4); }
    /* ms-box invalid state */
    .ms-box.ms-invalid       { border-color: var(--ica-error); }
    /* Native text input matching ica-text-input */
    .f-input {
      display: block; width: 100%; height: 32px; padding: 0 10px;
      border: 1px solid var(--ica-color-border); border-radius: var(--ica-border-radius-8);
      font-size: var(--font-size-14); font-family: var(--font-lato);
      background: var(--ica-secondary-subtle); color: var(--ica-color-on-app-surface);
      outline: none;
    }
    .f-input:hover  { background: var(--ica-color-surface-alt); }
    .f-input:focus  { border-color: var(--ica-color-on-app-surface); box-shadow: 0 0 0 3px var(--ica-tertiary-opacity-focus); }

    .dlg-warning {
      display: flex; align-items: flex-start; gap: 8px;
      font-size: 12px; line-height: 1.45;
      color: var(--ica-warning-on-surface);
      background: var(--ica-warning-subtle);
      border: 1px solid var(--ica-warning);
      border-radius: 6px; padding: 10px 12px;
    }

    /* ============================================================
       Existing Features panel
    ============================================================ */
    .feat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 32px; margin-top: 20px; }
    .feat-row  { display: flex; align-items: flex-start; gap: 14px; padding: 10px 0; border-bottom: 1px solid var(--ica-color-border-alt); }
    .feat-row:last-child { border-bottom: none; }
    .feat-name { font-size: 14px; font-weight: 700; margin-bottom: 4px; }
    .feat-desc { font-size: 12px; color: var(--ica-secondary-active); }
    .feat-heading { font-size: 14px; font-weight: 700; padding: 10px 0 8px; }
  </style>
</head>
<body>
<div id="root"></div>
<script src="../design-system/ICANotes-design-sync-bundle/_vendor/react.js"></script>
<script src="../design-system/ICANotes-design-sync-bundle/_vendor/react-dom.js"></script>
<script src="../design-system/ICANotes-design-sync-bundle/_ds_bundle.js"></script>
<script type="text/babel">
  const {
    'ica-toggle':            Toggle,
    'ica-button':            Button,
    'ica-panel':             Panel,
    'ica-panel-heading':     PanelHeading,
    'ica-text-input':        TextInput,
    'ica-formfield':         FormField,
    'ica-dropdown':          Dropdown,
  } = window.ICANotes;

  const { useState } = React;

  /* ---- Static data ---- */
  const TABS = ['Practice Information','Providers','Calendar Settings','Client Portal',
    'Practice Settings','Data Requirements','Revenue Cycle Management',
    'Practice Forms','Note Settings','Account Management'];

  const NAV_ITEMS = [
    { label:'DASHBOARD' },{ label:'CHARTROOM' },{ label:'CALENDAR' },
    { label:'QUICK CALENDAR' }, null,
    { label:'SUPPORT' },{ label:'MORE' },{ label:'SETTINGS', active:true },
  ];

  const SIDEBAR = [
    { key:'section',                   label:'Portal Settings',         section:true },
    { key:'portal-invitation-email',   label:'Portal Invitation Email' },
    { key:'form-package-email',        label:'Form Package Email' },
    { key:'single-form-email',         label:'Single Form Email' },
    { key:'message-notification-email',label:'Message Notification Email' },
    { key:'message-topics',            label:'Message Topics',           isNew:true },
  ];

  const ALL_TOPICS = [
    { key:'medical',     name:'Medical' },
    { key:'appointment', name:'Appointment' },
    { key:'medication',  name:'Medication' },
    { key:'billing',     name:'Billing' },
    { key:'other',       name:'Other' },
  ];

  const STAFF = [
    { value:'',           label:'— No one assigned —' },
    { value:'jones',      label:'Dr. Sarah Jones' },
    { value:'chen',       label:'Dr. Michael Chen' },
    { value:'patel',      label:'Dr. Anita Patel' },
    { value:'martinez',   label:'Angela Martinez' },
    { value:'front-desk', label:'Front Desk' },
  ];

  const OUTSIDE_CASELOAD = new Set(['martinez','front-desk']);

  const topicName  = key  => ALL_TOPICS.find(t => t.key === key)?.name || key;
  const staffLabel = val  => STAFF.find(s => s.value === val)?.label || '—';

  /* ---- Nav icons ---- */
  const NavIcon = ({ label }) => {
    if (label === 'DASHBOARD')      return <svg viewBox="0 0 20 20" width="20" height="20" fill="currentColor"><rect x="2" y="2" width="7" height="7" rx="1.5"/><rect x="11" y="2" width="7" height="7" rx="1.5"/><rect x="2" y="11" width="7" height="7" rx="1.5"/><rect x="11" y="11" width="7" height="7" rx="1.5"/></svg>;
    if (label === 'CHARTROOM')      return <svg viewBox="0 0 20 20" width="20" height="20" fill="none" stroke="currentColor" strokeWidth="1.6"><rect x="4" y="2" width="12" height="16" rx="1.5"/><line x1="7" y1="7" x2="13" y2="7"/><line x1="7" y1="10" x2="13" y2="10"/><line x1="7" y1="13" x2="11" y2="13"/></svg>;
    if (label === 'CALENDAR')       return <svg viewBox="0 0 20 20" width="20" height="20" fill="none" stroke="currentColor" strokeWidth="1.6"><rect x="2" y="4" width="16" height="14" rx="1.5"/><line x1="2" y1="8" x2="18" y2="8"/><line x1="6" y1="2" x2="6" y2="6"/><line x1="14" y1="2" x2="14" y2="6"/></svg>;
    if (label === 'QUICK CALENDAR') return <svg viewBox="0 0 20 20" width="20" height="20" fill="none" stroke="currentColor" strokeWidth="1.6"><rect x="2" y="4" width="16" height="14" rx="1.5"/><line x1="2" y1="8" x2="18" y2="8"/><line x1="6" y1="2" x2="6" y2="6"/><line x1="14" y1="2" x2="14" y2="6"/><path d="M10 11v2.5l1.5 1" strokeLinecap="round"/></svg>;
    if (label === 'SUPPORT')        return <svg viewBox="0 0 20 20" width="20" height="20" fill="none" stroke="currentColor" strokeWidth="1.6"><circle cx="10" cy="10" r="8"/><path d="M7.5 7.5a2.5 2.5 0 015 0c0 1.5-2.5 2-2.5 3.5" strokeLinecap="round"/><circle cx="10" cy="14.5" r=".75" fill="currentColor" stroke="none"/></svg>;
    if (label === 'MORE')           return <svg viewBox="0 0 20 20" width="20" height="20" fill="currentColor"><circle cx="4" cy="10" r="1.8"/><circle cx="10" cy="10" r="1.8"/><circle cx="16" cy="10" r="1.8"/></svg>;
    if (label === 'SETTINGS')       return <svg viewBox="0 0 20 20" width="20" height="20" fill="none" stroke="currentColor" strokeWidth="1.6"><circle cx="10" cy="10" r="2.8"/><path d="M10 2v2M10 16v2M2 10h2M16 10h2M4.1 4.1l1.4 1.4M14.5 14.5l1.4 1.4M4.1 15.9l1.4-1.4M14.5 5.5l1.4-1.4"/></svg>;
    return null;
  };

  /* ================================================================
     SingleSelect — custom component matching ica-dropdown visual spec.
     ica-dropdown change events don't bubble reliably, so we build our own.
  ================================================================ */
  function SingleSelect({ value, onChange, options, placeholder, disabled, invalid }) {
    const [open, setOpen] = useState(false);
    const selected = options.find(o => o.value === value);

    function pick(val) { onChange(val); setOpen(false); }

    return (
      <div className="ms-wrap">
        <div
          className={`ms-box${open ? ' ms-open' : ''}${invalid ? ' ms-invalid' : ''}`}
          style={{ cursor: disabled ? 'not-allowed' : 'pointer', opacity: disabled ? .6 : 1 }}
          onClick={() => !disabled && setOpen(o => !o)}
        >
          <span className="ms-value">
            {selected
              ? selected.label
              : <span className="ms-placeholder">{placeholder || 'Select…'}</span>
            }
          </span>
          <span className="ms-caret">
            <svg width="16" height="6" viewBox="0 0 16 6" fill="none">
              <path d="M1 1l7 4 7-4" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round"/>
            </svg>
          </span>
        </div>
        {open && (
          <>
            <div style={{ position:'fixed', inset:0, zIndex:499 }} onClick={() => setOpen(false)} />
            <div className="ms-list">
              {options.map(opt => (
                <div
                  key={opt.value}
                  className={`ms-item${value === opt.value ? ' ms-checked' : ''}`}
                  onClick={() => pick(opt.value)}
                >
                  {opt.label}
                </div>
              ))}
            </div>
          </>
        )}
      </div>
    );
  }

  /* ================================================================
     MultiSelect — custom component matching ica-dropdown-multiple visual spec.
     ica-dropdown-multiple's valueChanges output doesn't wire up reliably as a
     React prop in this bundle, so we replicate its appearance with native state.
  ================================================================ */
  function MultiSelect({ value = [], onChange, options, placeholder }) {
    const [open, setOpen] = useState(false);

    const selectedLabels = value
      .map(v => options.find(o => o.value === v)?.label)
      .filter(Boolean);

    function toggle(val) {
      onChange(value.includes(val) ? value.filter(v => v !== val) : [...value, val]);
    }

    return (
      <div className="ms-wrap">
        <div className={`ms-box${open ? ' ms-open' : ''}`} onClick={() => setOpen(o => !o)}>
          <span className="ms-value">
            {selectedLabels.length > 0
              ? selectedLabels.join(', ')
              : <span className="ms-placeholder">{placeholder || 'Select…'}</span>
            }
          </span>
          <span className="ms-caret">
            <svg width="16" height="6" viewBox="0 0 16 6" fill="none">
              <path d="M1 1l7 4 7-4" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round"/>
            </svg>
          </span>
        </div>

        {open && (
          <>
            <div style={{ position:'fixed', inset:0, zIndex:499 }} onClick={() => setOpen(false)} />
            <div className="ms-list">
              {options.map(opt => (
                <label key={opt.value} className={`ms-item${value.includes(opt.value) ? ' ms-checked' : ''}`}>
                  <input
                    type="checkbox"
                    className="ms-cb"
                    checked={value.includes(opt.value)}
                    onChange={() => toggle(opt.value)}
                    onClick={e => e.stopPropagation()}
                  />
                  {opt.label}
                </label>
              ))}
            </div>
          </>
        )}
      </div>
    );
  }

  /* ================================================================
     TopicDialog — all fields use ICANotes design system components
  ================================================================ */
  function TopicDialog({ title, form, setForm, onSave, onCancel, availableTopics, isEditing }) {
    const topicErr   = form.triedSave && !form.topicKey;
    const anyOutside = (form.recipients || []).some(r => OUTSIDE_CASELOAD.has(r));

    return (
      <div className="dlg-backdrop" onClick={onCancel}>
        <div className="dlg" onClick={e => e.stopPropagation()}>

          <div className="dlg-head">
            <div className="dlg-title">{title}</div>
          </div>

          <div className="dlg-body">

            {/* Topic — SingleSelect */}
            <div>
              <label className="dlg-label">Topic <span style={{ color:'var(--ica-error)' }}>*</span></label>
              <SingleSelect
                value={form.topicKey}
                onChange={val => setForm(p => ({ ...p, topicKey: val, triedSave: false }))}
                options={availableTopics.map(t => ({ value: t.key, label: t.name }))}
                placeholder="Select topic…"
                invalid={topicErr}
                disabled={isEditing}
              />
              {topicErr && <div className="dlg-error">Please select a topic.</div>}
            </div>

            {/* Recipients — MultiSelect */}
            <div>
              <label className="dlg-label">Recipients</label>
              <MultiSelect
                value={form.recipients || []}
                onChange={vals => setForm(p => ({ ...p, recipients: vals }))}
                options={STAFF.filter(s => s.value)}
                placeholder="Choose staff members…"
              />
            </div>

            {/* Caseload warning */}
            {anyOutside && (
              <div className="dlg-warning">
                <span style={{ flexShrink: 0 }}>⚠</span>
                <span>One or more selected staff members are outside the client's caseload and may not be able to view the message.</span>
              </div>
            )}

            {/* Patient-facing name — native input styled as ica-text-input */}
            <div>
              <label className="dlg-label">Patient-facing name</label>
              <input
                type="text"
                className="f-input"
                value={form.displayName}
                placeholder="Same as recipient name"
                onChange={e => setForm(p => ({ ...p, displayName: e.target.value }))}
              />
              <div className="dlg-hint">Optional. Patients see this label instead of the recipient's name.</div>
            </div>

          </div>

          <div className="dlg-foot">
            <div onClick={onCancel} style={{ cursor: 'pointer' }}>
              <Button title="Cancel" themeColor="secondary" fillMode="outline" size="medium" />
            </div>
            <div onClick={onSave} style={{ cursor: 'pointer' }}>
              <Button title="Save" themeColor="primary" fillMode="solid" size="medium" />
            </div>
          </div>

        </div>
      </div>
    );
  }

  /* ================================================================
     MessageTopicsPanel
  ================================================================ */
  const BLANK = { topicKey:'', recipients:[], displayName:'', triedSave:false };

  function MessageTopicsPanel() {
    const [rows,    setRows]    = useState([]);
    const [dlgOpen, setDlgOpen] = useState(false);
    const [editIdx, setEditIdx] = useState(null);
    const [form,    setForm]    = useState(BLANK);

    const usedKeys   = rows.map(r => r.topicKey);
    const available  = editIdx !== null
      ? ALL_TOPICS
      : ALL_TOPICS.filter(t => !usedKeys.includes(t.key));
    const allUsed    = available.length === 0;

    const openNew  = ()  => { setForm(BLANK); setEditIdx(null); setDlgOpen(true); };
    const openEdit = (i) => { setForm({ ...rows[i], triedSave:false }); setEditIdx(i); setDlgOpen(true); };
    const closeDlg = ()  => setDlgOpen(false);

    const handleSave = () => {
      if (!form.topicKey) { setForm(p => ({ ...p, triedSave:true })); return; }
      setRows(prev =>
        editIdx !== null
          ? prev.map((r,i) => i === editIdx ? { ...form } : r)
          : [...prev, { ...form }]
      );
      setDlgOpen(false);
    };

    const handleDelete = i => setRows(prev => prev.filter((_,idx) => idx !== i));

    const toggleRow = i => setRows(prev =>
      prev.map((r,idx) => idx === i ? { ...r, enabled: r.enabled === false } : r)
    );

    return (
      <>
        <Panel>
          <PanelHeading type="title" title="Message Topics" />

          <p className="panel-desc">
            Configure which topics patients can select when composing a portal message, and who receives each one.
          </p>

          <div className="grid-wrap">
            {/* Toolbar — matches kendo-grid editing state */}
            <div className="grid-toolbar">
              <div onClick={allUsed ? undefined : openNew} style={{ cursor: allUsed ? 'default' : 'pointer' }}>
                <Button title="New Topic" themeColor="primary" fillMode="solid" size="medium" disabled={allUsed} />
              </div>
            </div>
            <table className="kgrid">
              <thead>
                <tr>
                  <th style={{ width:170 }}>Topic</th>
                  <th>Recipient</th>
                  <th>Patient-facing name</th>
                  <th style={{ width:140 }}>Actions</th>
                </tr>
              </thead>
              <tbody>
                {rows.length === 0 ? (
                  <tr>
                    <td colSpan={4}>
                      <div className="grid-empty">No records available.</div>
                    </td>
                  </tr>
                ) : rows.map((row, i) => {
                  const on      = row.enabled !== false;
                  const outside = (row.recipients || []).some(r => OUTSIDE_CASELOAD.has(r));
                  const recipientDisplay = (row.recipients || []).length > 0
                    ? (row.recipients || []).map(r => staffLabel(r)).join(', ')
                    : null;
                  return (
                    <tr key={i}>
                      <td>
                        <div style={{ display:'flex', alignItems:'center', gap:10 }}>
                          <div style={{ cursor:'pointer', flexShrink:0 }} onClick={() => toggleRow(i)}>
                            <Toggle controlValue={on} size="small" />
                          </div>
                          <span className="row-name" style={{ color: on ? undefined : 'var(--ica-secondary-active)' }}>
                            {topicName(row.topicKey)}
                          </span>
                        </div>
                      </td>
                      <td>
                        {recipientDisplay
                          ? <span>
                              {recipientDisplay}
                              {outside && <span className="outside-chip">⚠ outside caseload</span>}
                            </span>
                          : <span className="row-muted">Patient chooses</span>
                        }
                      </td>
                      <td>
                        {row.displayName || <span className="row-muted">Same as recipient</span>}
                      </td>
                      <td>
                        <div className="row-actions">
                          <div onClick={() => openEdit(i)} style={{ cursor:'pointer' }}>
                            <Button title="Edit" themeColor="base" fillMode="solid" size="small" />
                          </div>
                          <div onClick={() => handleDelete(i)} style={{ cursor:'pointer' }}>
                            <Button title="Delete" themeColor="error" fillMode="outline" size="small" />
                          </div>
                        </div>
                      </td>
                    </tr>
                  );
                })}
              </tbody>
            </table>

            <div className="grid-footer">
              <button className="pg-btn" disabled>«</button>
              <button className="pg-btn" disabled>‹</button>
              <div className="pg-current">1</div>
              <button className="pg-btn" disabled>›</button>
              <button className="pg-btn" disabled>»</button>
              <select className="pg-select"><option>25</option><option>50</option></select>
              <span>items per page</span>
              <span className="pg-count">
                {rows.length === 0
                  ? '0 – 0 of 0 items'
                  : `1 – ${rows.length} of ${rows.length} items`}
              </span>
            </div>
          </div>
        </Panel>

        {dlgOpen && (
          <TopicDialog
            title={editIdx !== null ? 'Edit Topic' : 'New Topic'}
            form={form}
            setForm={setForm}
            onSave={handleSave}
            onCancel={closeDlg}
            availableTopics={available}
            isEditing={editIdx !== null}
          />
        )}
      </>
    );
  }

  /* ================================================================
     FeaturesPanel — shown for other sidebar items
  ================================================================ */
  function FeaturesPanel() {
    const left = [
      { key:'info',     name:'My Information', desc:'Allow clients to manage their personal information.', on:true },
      { key:'appts',    name:'Appointments',   desc:'Allow clients to view upcoming appointments, appointment history, and self-schedule appointments if enabled.', on:true },
      { key:'messages', name:'Messages',       desc:'Allow clients the ability to send messages to their provider.', on:true },
      { key:'docs',     name:'My Documents',   desc:'Allow clients to complete forms from the portal.', on:true },
      { key:'upload',   name:null,             desc:'Allow clients to upload documents from portal.', on:false },
    ];
    const right = [
      { key:'card',    name:'Card on File',                       desc:'Allows clients to view and manage their saved payment cards.', on:false },
      { key:'balance', name:'Client Balance and Account Details', desc:'Allows clients to view their outstanding balance and account details.', on:false },
      { key:'pay',     name:'Pay Now',                            desc:'Allows clients to pay invoices directly from the portal without requiring a payment request email.', on:false },
    ];
    return (
      <Panel>
        <PanelHeading type="title" title="Features in the client portal" />
        <div className="feat-grid">
          <div>
            {left.map(f => (
              <div key={f.key} className="feat-row">
                <Toggle controlValue={f.on} size="medium" />
                <div>
                  {f.name && <div className="feat-name">{f.name}</div>}
                  <div className="feat-desc">{f.desc}</div>
                </div>
              </div>
            ))}
          </div>
          <div>
            <div className="feat-heading">My Account</div>
            {right.map(f => (
              <div key={f.key} className="feat-row">
                <Toggle controlValue={f.on} size="medium" />
                <div>
                  <div className="feat-name">{f.name}</div>
                  <div className="feat-desc">{f.desc}</div>
                </div>
              </div>
            ))}
          </div>
        </div>
      </Panel>
    );
  }

  /* ================================================================
     App
  ================================================================ */
  function App() {
    const [active, setActive] = useState('message-topics');

    return (
      <div className="l-app">

        {/* Icon nav */}
        <nav className="icon-nav">
          {NAV_ITEMS.map((item, i) =>
            item === null
              ? <div key={i} className="icon-nav-spacer" />
              : (
                <div key={item.label} className={`nav-item${item.active ? ' active' : ''}`}>
                  <div className="nav-icon"><NavIcon label={item.label} /></div>
                  {item.label}
                </div>
              )
          )}
        </nav>

        <div className="l-main">
          {/* Header */}
          <header className="app-header">
            <div className="logo-wrap">
              <div className="logo-row">
                <span className="logo-text">ICANotes</span>
                <svg className="logo-icon" viewBox="0 0 24 24" fill="none">
                  <ellipse cx="12" cy="13" rx="6" ry="5" fill="#e8734a"/>
                  <circle cx="12" cy="10" r="3.5" fill="#e8734a"/>
                  <ellipse cx="6.5" cy="15" rx="2" ry="1.2" fill="#e8734a" transform="rotate(-20 6.5 15)"/>
                  <ellipse cx="17.5" cy="15" rx="2" ry="1.2" fill="#e8734a" transform="rotate(20 17.5 15)"/>
                  <ellipse cx="8"  cy="18" rx="1.6" ry="1" fill="#e8734a" transform="rotate(15 8 18)"/>
                  <ellipse cx="16" cy="18" rx="1.6" ry="1" fill="#e8734a" transform="rotate(-15 16 18)"/>
                  <ellipse cx="12" cy="20" rx="1.2" ry="1.5" fill="#e8734a"/>
                </svg>
                <span className="logo-plus">+</span>
              </div>
              <div className="logo-sub">Behavioral Health EHR</div>
            </div>
            <div className="hdr-search">
              <FormField orientation="horizontal" size="small">
                <TextInput size="small" placeholder="Search Charts" stretch />
              </FormField>
            </div>
            <div className="hdr-right">
              <div className="hdr-icon">
                <svg width="17" height="17" viewBox="0 0 18 18" fill="none"><rect x="2" y="2" width="6" height="6" rx="1" fill="currentColor" opacity=".6"/><rect x="10" y="2" width="6" height="6" rx="1" fill="currentColor" opacity=".6"/><rect x="2" y="10" width="6" height="6" rx="1" fill="currentColor" opacity=".6"/><rect x="10" y="10" width="6" height="6" rx="1" fill="currentColor" opacity=".6"/></svg>
              </div>
              <div className="hdr-icon">
                <svg width="17" height="17" viewBox="0 0 18 18" fill="none"><path d="M3 3h12a1 1 0 011 1v8a1 1 0 01-1 1H6l-3 3V4a1 1 0 011-1z" stroke="currentColor" strokeWidth="1.4" fill="none" opacity=".7"/></svg>
              </div>
              <div className="hdr-user">
                <div className="avatar">CC</div>
                <span>Christian Carls…</span>
                <svg width="11" height="11" viewBox="0 0 12 12" fill="none"><path d="M2 4l4 4 4-4" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round"/></svg>
              </div>
            </div>
          </header>

          {/* Tab bar */}
          <nav className="tab-bar">
            {TABS.map(t => (
              <div key={t} className={`tab${t === 'Client Portal' ? ' active' : ''}`}>{t}</div>
            ))}
          </nav>

          {/* Settings area */}
          <div className="settings-area">
            <aside className="settings-nav">
              {SIDEBAR.map(link =>
                link.section
                  ? <div key={link.key} className="nav-section">{link.label}</div>
                  : (
                    <div
                      key={link.key}
                      className={`nav-link${active === link.key ? ' active' : ''}`}
                      onClick={() => setActive(link.key)}
                    >
                      {link.label}
                      {link.isNew && <span className="badge">NEW</span>}
                    </div>
                  )
              )}
            </aside>

            <div className="settings-content">
              {active === 'message-topics' ? <MessageTopicsPanel /> : <FeaturesPanel />}
            </div>
          </div>
        </div>
      </div>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
